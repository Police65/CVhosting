    <meta charset="UTF-8" />

    <title>CV - Fermin Chirinos</title>
    <link rel="icon" href="/favicon.ico" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=Noto+Sans:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <style>
      body {
        font-family: 'Inter', "Noto Sans", sans-serif;
        background-color: #f8fafc; /* bg-slate-50 fallback */
        background-image: url('/background.jpg');
        background-size: cover;
        background-position: center center;
        background-attachment: fixed;
        background-repeat: no-repeat;
      }
       /* Custom scrollbar for a better look */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #e2e8f0; /* slate-200 */
      }
      ::-webkit-scrollbar-thumb {
        background: #1172d4;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #0b5ed7;
      }

      /* Animation Styles */
      .fade-in-element {
        opacity: 0;
        transform: translateY(20px);
        transition: opacity 0.6s ease-out, transform 0.6s ease-out;
      }
      .fade-in-element.is-visible {
        opacity: 1;
        transform: translateY(0);
      }
      .cv-card {
        opacity: 0;
        transform: scale(0.95);
        transition: opacity 0.5s ease-out, transform 0.5s ease-out;
      }
      .cv-card.loaded {
        opacity: 1;
        transform: scale(1);
      }

    </style>
